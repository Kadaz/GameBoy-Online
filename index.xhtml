<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Game Boy / Game Boy Color - PS5 Test</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #111;
    color: #fff;
    font-family: Arial, sans-serif;
    text-align: center;
}

body {
    padding: 20px;
}

h1 {
    font-size: 24px;
}

#status {
    margin: 20px auto;
    padding: 12px;
    max-width: 600px;
    background: #222;
    border-radius: 6px;
}

#game {
    width: 480px;
    height: 432px;
    max-width: 95vw;
    margin: 20px auto;
    background: #000;
}

canvas {
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
}

button {
    padding: 12px 24px;
    margin: 8px;
    font-size: 16px;
}
</style>

</head>

<body>

<h1>Game Boy / Game Boy Color</h1>

<div id="status">
    Searching Retro-Media for GB / GBC ROMs...
</div>

<div id="game">
    <canvas
        id="screen"
        width="160"
        height="144">
    </canvas>
</div>

<button id="start" disabled>
    LOADING...
</button>

<script>

/*
============================================================
PS5 GAME BOY / GAME BOY COLOR TEST
============================================================

ROM source:

Kadaz/Retro-Media/roms/

Supported:

.gb
.gbc

No PC file picker.
No WebAssembly.
============================================================
*/


const status =
    document.getElementById("status");

const startButton =
    document.getElementById("start");


/*
------------------------------------------------------------
FIND ROMS IN RETRO-MEDIA
------------------------------------------------------------
*/

async function findRetroMediaROM() {

    status.textContent =
        "Searching Retro-Media...";


    const apiURL =
        "https://api.github.com/repos/" +
        "Kadaz/Retro-Media/git/trees/main?recursive=1";


    const response =
        await fetch(
            apiURL,
            {
                cache: "no-store"
            }
        );


    if (!response.ok) {

        throw new Error(
            "GitHub API error: HTTP " +
            response.status
        );

    }


    const data =
        await response.json();


    const roms =
        data.tree.filter(
            function(item) {

                if (item.type !== "blob") {
                    return false;
                }


                return /^roms\/.*\.(gb|gbc)$/i
                    .test(item.path);

            }
        );


    if (!roms.length) {

        throw new Error(
            "No .gb or .gbc ROMs found."
        );

    }


    /*
    --------------------------------------------------------
    PREFER GBC
    --------------------------------------------------------
    */

    roms.sort(
        function(a, b) {

            const aGbc =
                /\.gbc$/i.test(a.path);

            const bGbc =
                /\.gbc$/i.test(b.path);


            return bGbc - aGbc;

        }
    );


    return roms[0];

}


/*
------------------------------------------------------------
LOAD ROM
------------------------------------------------------------
*/

async function loadROM() {

    try {

        status.textContent =
            "Finding GB / GBC ROM...";


        const rom =
            await findRetroMediaROM();


        const filename =
            rom.path
                .split("/")
                .pop();


        status.textContent =
            "Found: " +
            filename;


        const romURL =
            "https://raw.githubusercontent.com/" +
            "Kadaz/Retro-Media/main/" +
            rom.path
                .split("/")
                .map(
                    encodeURIComponent
                )
                .join("/");


        const romResponse =
            await fetch(
                romURL,
                {
                    cache: "no-store"
                }
            );


        if (!romResponse.ok) {

            throw new Error(
                "ROM download failed: HTTP " +
                romResponse.status
            );

        }


        const buffer =
            await romResponse.arrayBuffer();


        if (!buffer.byteLength) {

            throw new Error(
                "ROM file is empty."
            );

        }


        status.textContent =
            "ROM downloaded: " +
            filename;


        /*
        ----------------------------------------------------
        IMPORTANT
        ----------------------------------------------------

        The original GameBoy-Online project must expose
        its emulator constructor/functions here.

        We intentionally do NOT use a PC file picker.
        ----------------------------------------------------
        */


        if (
            typeof GameBoyEmulator !==
            "undefined"
        ) {

            const emulator =
                new GameBoyEmulator(
                    document.getElementById(
                        "screen"
                    )
                );


            emulator.loadROM(
                new Uint8Array(buffer)
            );


            emulator.start();


            status.textContent =
                "Running: " +
                filename;


            startButton.textContent =
                "RUNNING";


            return;

        }


        /*
        ----------------------------------------------------
        FALLBACK DETECTION
        ----------------------------------------------------

        Different versions/forks expose different
        constructor names.

        Instead of silently failing, tell us exactly
        what happened.
        ----------------------------------------------------
        */


        status.innerHTML =
            "ROM found and downloaded: <b>" +
            filename +
            "</b><br><br>" +
            "The GameBoy-Online emulator API was " +
            "not detected.";


        startButton.textContent =
            "ENGINE NOT DETECTED";


    }
    catch(error) {

        console.error(error);


        status.textContent =
            "ERROR: " +
            error.message;


        startButton.textContent =
            "FAILED";

    }

}


/*
------------------------------------------------------------
START
------------------------------------------------------------
*/

window.addEventListener(
    "load",
    function() {

        loadROM();

    }
);

</script>

</body>
</html>
